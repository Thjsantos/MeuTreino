<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Treino</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#e8590c">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<header>
  <div class="row between">
    <div class="row">
      <button id="menuBtn" class="btn" aria-haspopup="true">☰ <span id="menuLabel">Meus Treinos</span></button>
    </div>
    <button id="userbar" class="btn sm" data-switch title="Trocar de usuário" hidden>👤 <span id="who"></span> ⇄</button>
  </div>
  <nav id="nav" hidden>
    <button data-view="treinos" class="active">Meus Treinos</button>
    <button data-view="executar">Treinar</button>
    <button data-view="calendario">Calendário</button>
    <button data-view="exercicios">Exercícios</button>
  </nav>
</header>

<main>
  <section id="view-exercicios">
    <div class="filters">
      <input id="q" type="search" placeholder="Buscar exercício...">
      <select id="fMusculo"></select>
      <select id="fEquip"></select>
    </div>
    <p id="count" class="muted"></p>
    <div id="grid" class="grid"></div>
    <button id="more" class="btn" hidden>Carregar mais</button>
  </section>

  <section id="view-treinos" hidden></section>
  <section id="view-executar" hidden></section>
  <section id="view-calendario" hidden></section>
</main>

<dialog id="modal"></dialog>
<dialog id="welcome"></dialog>
<div id="toast"></div>

<script src="exercises.js"></script>
<script src="exercises_pt.js"></script>
<script src="corpo.js"></script>
<script src="app.js"></script>
</body>
</html>
